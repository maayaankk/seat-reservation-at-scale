services:
  - type: web
    name: seat-reservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ADMIN_TOKEN
        sync: false
      - key: ENABLE_DEV_AUTH
        value: "false"
      - fromDatabase:
          name: seat-reservation-db
          property: connectionString
        key: DATABASE_URL

databases:
  - name: seat-reservation-db
    databaseName: seat_reservation
    user: seat_reservation
    plan: free
    region: singapore
    pgVersion: 18