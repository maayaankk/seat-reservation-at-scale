name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    name: Test Suite (Unit, Integration, PostgreSQL, Load, Chaos)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          ADMIN_TOKEN: test-admin-token
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
      - name: Start server for integration tests
        run: |
          npm run build
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - name: Run all tests (unit, integration, PostgreSQL, load, chaos)
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t seat-reservation:ci .
      - name: Save Docker image for downstream jobs
        run: docker save seat-reservation:ci | gzip > seat-reservation.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: seat-reservation-image
          path: seat-reservation.tar.gz
          retention-days: 1

  docker-test:
    name: Docker Test (API endpoints inside container)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Docker image
        run: |
          gunzip -c seat-reservation.tar.gz | docker load
      - name: Start app container
        run: |
          docker run -d --name seat-reservation \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e DATABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e JWT_SECRET=test-secret-change-in-production-min-32-chars-long \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_TOKEN=test-admin-token \
            -e ENABLE_DEV_AUTH=true \
            -e NODE_ENV=test \
            seat-reservation:ci
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
      - name: Test API endpoints inside container
        run: |
          curl -sf http://localhost:8080/health/live
          curl -sf http://localhost:8080/health/ready
          SHOW=$(curl -sf -X POST http://localhost:8080/shows \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: test-admin-token" \
            -d '{"name":"ci-test","seats":["A1","A2"],"price_paise":25000}')
          SHOW_ID=$(echo $SHOW | jq -r .id)
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/token \
            -H "Content-Type: application/json" \
            -d '{"user_id":"ci-user"}' | jq -r .token)
          curl -sf -X POST "http://localhost:8080/shows/${SHOW_ID}/reserve" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Idempotency-Key: ci-test" \
            -d '{"seats":["A1"]}'
          curl -sf http://localhost:8080/metrics | grep -q "reservations_confirmed_total"
          echo "All API endpoints working inside container"

  chaos-test:
    name: Chaos Test (Kill DB mid-burst)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Docker image
        run: gunzip -c seat-reservation.tar.gz | docker load
      - name: Start app container
        run: |
          docker run -d --name seat-reservation \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e DATABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e JWT_SECRET=test-secret-change-in-production-min-32-chars-long \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_TOKEN=test-admin-token \
            -e ENABLE_DEV_AUTH=true \
            -e NODE_ENV=test \
            seat-reservation:ci
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
      - name: Create test show
        run: |
          SHOW=$(curl -sf -X POST http://localhost:8080/shows \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: test-admin-token" \
            -d '{"name":"chaos-test","seats":["A1","A2","A3"],"price_paise":25000}')
          echo "SHOW_ID=$(echo $SHOW | jq -r .id)" >> $GITHUB_ENV
      - name: Start burst in background
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/token \
            -H "Content-Type: application/json" \
            -d '{"user_id":"chaos-user"}' | jq -r .token)
          for i in {1..50}; do
            curl -sf -X POST "http://localhost:8080/shows/${SHOW_ID}/reserve" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Idempotency-Key: chaos-${i}" \
              -d '{"seats":["A1"]}' &
          done
          sleep 2
          echo "Killing PostgreSQL..."
          docker stop $(docker ps -q --filter "ancestor=postgres:16-alpine")
          sleep 5
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              echo "DB recovered"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/health/ready
      - name: Verify reconciliation after chaos
        run: |
          curl -sf "http://localhost:8080/shows/${SHOW_ID}?include_seats=false" | jq -e '.available + .held + .confirmed == .total_seats'
          echo "Reconciliation invariant holds after chaos"

  load-test:
    name: Load Test Gate (Burst Script)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Docker image
        run: gunzip -c seat-reservation.tar.gz | docker load
      - name: Start app container
        run: |
          docker run -d --name seat-reservation \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e DATABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e JWT_SECRET=test-secret-change-in-production-min-32-chars-long \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_TOKEN=test-admin-token \
            -e ENABLE_DEV_AUTH=true \
            -e NODE_ENV=test \
            seat-reservation:ci
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
      - name: Run burst test
        run: |
          chmod +x scripts/burst.sh
          ./scripts/burst.sh http://localhost:8080 test-admin-token \
            --users 500 --requests 10000 \
            --hot-seats "A12,A13" --retry-rate 0.15 \
            --concurrency 200 --timeout-ms 15000
        env:
          BASE_URL: http://localhost:8080
          ADMIN_TOKEN: test-admin-token
      - name: Verify burst results
        run: echo "Burst test passed - all 6 requirements validated"

  promote:
    name: Promote dev to main
    runs-on: ubuntu-latest
    needs: [lint-typecheck, build, test, docker]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge dev into main
        run: |
          git fetch origin main:main
          git merge --no-ff dev -m "chore: auto-merge dev to main [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}