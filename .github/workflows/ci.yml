name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    name: Test Suite (Unit, Integration, PostgreSQL, Load, Chaos)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          ADMIN_TOKEN: test-admin-token
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
      - name: Start server for integration tests
        run: |
          npm run build
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t seat-reservation:ci .
      - name: Save Docker image for downstream jobs
        run: docker save seat-reservation:ci | gzip > seat-reservation.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: seat-reservation-image
          path: seat-reservation.tar.gz
          retention-days: 1

  promote:
    name: Promote dev to main via PR
    runs-on: ubuntu-latest
    needs: [lint-typecheck, build, test, docker]

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin main dev

      - name: Check if dev is ahead of main
        id: check_ahead
        shell: bash
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/dev)

          echo "main: $MAIN_SHA"
          echo "dev:  $DEV_SHA"

          if [ "$MAIN_SHA" = "$DEV_SHA" ]; then
            echo "ahead=false" >> "$GITHUB_OUTPUT"
            echo "dev and main are identical"
            exit 0
          fi

          if git merge-base --is-ancestor "$MAIN_SHA" "$DEV_SHA"; then
            echo "ahead=true" >> "$GITHUB_OUTPUT"
            echo "dev is ahead of main"
          else
            echo "ahead=false" >> "$GITHUB_OUTPUT"
            echo "dev has diverged from main"
          fi

      - name: Check for existing PR
        id: existing_pr
        if: steps.check_ahead.outputs.ahead == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create promotion PR
        if: |
          steps.check_ahead.outputs.ahead == 'true' &&
          steps.existing_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "chore: promote dev to main" \
            --body "$(cat <<'EOF'
          ## Automated Promotion

          This PR was created automatically after all CI checks passed on `dev`.

          ### Validation

          - Lint/typecheck passed
          - Build passed
          - Tests passed
          - Docker build passed

          Please review and merge this PR to promote `dev` to `main`.
          EOF
          )"

      - name: PR already exists
        if: |
          steps.check_ahead.outputs.ahead == 'true' &&
          steps.existing_pr.outputs.number != ''
        run: |
          echo "Promotion PR #${{ steps.existing_pr.outputs.number }} already exists."