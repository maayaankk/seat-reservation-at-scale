name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          ADMIN_TOKEN: test-admin-token
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
      # Start server in background for integration tests
      - name: Start server
        run: |
          npm run build
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      # Stop server
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t seat-reservation:ci .
      # Save image for downstream jobs
      - name: Save Docker image
        run: docker save seat-reservation:ci | gzip > seat-reservation.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: seat-reservation-image
          path: seat-reservation.tar.gz
          retention-days: 1

  docker-test:
    name: Docker Test (API endpoints inside container)
    runs-on: ubuntu-latest
    needs: [docker-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Docker image
        run: |
          gunzip -c seat-reservation.tar.gz | docker load
      - name: Start app container
        run: |
          docker run -d --name seat-reservation \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e DATABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e JWT_SECRET=test-secret-change-in-production-min-32-chars-long \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_TOKEN=test-admin-token \
            -e ENABLE_DEV_AUTH=true \
            -e NODE_ENV=test \
            seat-reservation:ci
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
      - name: Test API endpoints inside container
        run: |
          # Health checks
          curl -sf http://localhost:8080/health/live
          curl -sf http://localhost:8080/health/ready
          
          # Create show
          SHOW=$(curl -sf -X POST http://localhost:8080/shows \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: test-admin-token" \
            -d '{"name":"ci-test","seats":["A1","A2"],"price_paise":25000}')
          SHOW_ID=$(echo $SHOW | jq -r .id)
          
          # Create token
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/token \
            -H "Content-Type: application/json" \
            -d '{"user_id":"ci-user"}' | jq -r .token)
          
          # Reserve seat
          curl -sf -X POST "http://localhost:8080/shows/${SHOW_ID}/reserve" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Idempotency-Key: ci-test" \
            -d '{"seats":["A1"]}'
          
          # Test metrics endpoint
          curl -sf http://localhost:8080/metrics | grep -q "reservations_confirmed_total"
          
          echo "All API endpoints working inside container"

  chaos-test:
    name: Chaos Test (Kill DB mid-burst)
    runs-on: ubuntu-latest
    needs: [docker-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Docker image
        run: |
          gunzip -c seat-reservation.tar.gz | docker load
      - name: Start app container
        run: |
          docker run -d --name seat-reservation \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e DATABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e JWT_SECRET=test-secret-change-in-production-min-32-chars-long \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_TOKEN=test-admin-token \
            -e ENABLE_DEV_AUTH=true \
            -e NODE_ENV=test \
            seat-reservation:ci
          # Wait for server
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
      - name: Create test show
        run: |
          SHOW=$(curl -sf -X POST http://localhost:8080/shows \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: test-admin-token" \
            -d '{"name":"chaos-test","seats":["A1","A2","A3"],"price_paise":25000}')
          echo "SHOW_ID=$(echo $SHOW | jq -r .id)" >> $GITHUB_ENV
      - name: Start burst in background
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/token \
            -H "Content-Type: application/json" \
            -d '{"user_id":"chaos-user"}' | jq -r .token)
          
          # Start burst in background
          for i in {1..50}; do
            curl -sf -X POST "http://localhost:8080/shows/${SHOW_ID}/reserve" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Idempotency-Key: chaos-${i}" \
              -d '{"seats":["A1"]}' &
          done
          # Wait a bit for burst to start
          sleep 2
          
          # CHAOS: Kill PostgreSQL mid-burst
          echo "Killing PostgreSQL..."
          docker stop $(docker ps -q --filter "ancestor=postgres:16-alpine")
          
          # Wait for DB to come back (GitHub Actions service healthcheck will restart)
          sleep 5
          
          # Wait for DB to be healthy
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              echo "DB recovered"
              break
            fi
            sleep 1
          done
          
          # Verify system recovered
          curl -sf http://localhost:8080/health/ready
      - name: Verify reconciliation after chaos
        run: |
          curl -sf "http://localhost:8080/shows/${SHOW_ID}?include_seats=false" | jq -e '.available + .held + .confirmed == .total_seats'
          echo "Reconciliation invariant holds after chaos"

  load-test:
    name: Load Test Gate (Burst Script)
    runs-on: ubuntu-latest
    needs: [docker-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Load Docker image
        run: |
          gunzip -c seat-reservation.tar.gz | docker load
      - name: Start app container
        run: |
          docker run -d --name seat-reservation \
            -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e DATABASE_DIRECT_URL=postgres://postgres:postgres@postgres:5432/seat_reservation \
            -e JWT_SECRET=test-secret-change-in-production-min-32-chars-long \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_TOKEN=test-admin-token \
            -e ENABLE_DEV_AUTH=true \
            -e NODE_ENV=test \
            seat-reservation:ci
          # Wait for server
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
      - name: Run burst test
        run: |
          chmod +x scripts/burst.sh
          ./scripts/burst.sh http://localhost:8080 test-admin-token \
            --users 500 --requests 10000 \
            --hot-seats "A12,A13" --retry-rate 0.15 \
            --concurrency 200 --timeout-ms 15000
        env:
          BASE_URL: http://localhost:8080
          ADMIN_TOKEN: test-admin-token
      - name: Verify burst results
        run: |
          # Check burst test exited with 0 (all assertions passed)
          echo "Burst test passed - all 6 requirements validated"

  # Render deploys automatically via GitHub integration on push to main
  # No separate deploy step needed - Render watches the main branch