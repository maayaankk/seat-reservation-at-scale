name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    name: Test Suite (Unit, Integration, PostgreSQL, Load, Chaos)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          ADMIN_TOKEN: test-admin-token
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
      - name: Start server for integration tests
        run: |
          npm run build
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t seat-reservation:ci .
      - name: Save Docker image for downstream jobs
        run: docker save seat-reservation:ci | gzip > seat-reservation.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: seat-reservation-image
          path: seat-reservation.tar.gz
          retention-days: 1

  promote:
    name: Promote dev to main via PR
    runs-on: ubuntu-latest
    needs: [lint-typecheck, build, test, docker]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if dev is ahead of main
        id: check_ahead
        run: |
          git fetch origin main:main
          # Check if dev is ahead of main
          if git merge-base --is-ancestor main dev; then
            # Check if dev is strictly ahead (not equal)
            if [ "$(git rev-parse dev)" != "$(git rev-parse main)" ]; then
              echo "ahead=true" >> $GITHUB_OUTPUT
            else
              echo "ahead=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ahead=false" >> $GITHUB_OUTPUT
          fi
      - name: Create Pull Request
        if: steps.check_ahead.outputs.ahead == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-merge dev to main [skip ci]"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: dev
          base: main
          delete-branch: false
          title: "chore: auto-merge dev to main"
          body: |
            Automated PR from dev to main after successful CI.
            
            This PR was created automatically after all CI checks passed on the dev branch.
            Review and merge to deploy to production.
            
            [skip ci]
          labels: |
            auto-merge
            dependencies
          draft: false