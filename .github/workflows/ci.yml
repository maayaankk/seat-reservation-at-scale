name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seat_reservation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          ADMIN_TOKEN: test-admin-token
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
      # Start server in background for integration tests
      - name: Start server
        run: |
          npm run build
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8080/health/live > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/seat_reservation
          JWT_SECRET: test-secret-change-in-production-min-32-chars-long
          JWT_EXPIRES_IN: 24h
          ADMIN_TOKEN: test-admin-token
          ENABLE_DEV_AUTH: 'true'
          NODE_ENV: test
      # Stop server
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t seat-reservation:ci .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

  # Render deploys automatically via GitHub integration on push to main
  # No separate deploy step needed - Render watches the main branch