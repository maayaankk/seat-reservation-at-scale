app = "seat-reservation"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25000
    soft_limit = 20000

  [http_service.checks]
    interval = 10000
    timeout = 2000
    grace_period = 5
    method = "get"
    path = "/health/live"

[metrics]
  port = 8080
  path = "/metrics"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

# Kill timeout for graceful shutdown
kill_timeout = 35

# PostgreSQL will be attached separately via fly pg create